<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Gradientes de Fundo Studio (Púrpura & Violeta Tecnológico) -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="accentGlow" cx="65%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="accentGlowPurple" cx="30%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de Telemóveis -->
    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="phoneHeroScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="phoneDarkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Sombras de Dispositivos -->
    <filter id="deviceShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Máscara de recorte para o ecrã do smartphone (corrige cantos pontiagudos) -->
    <clipPath id="phoneScreenClip">
      <rect x="14" y="14" width="402" height="712" rx="32" />
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .text-title { font-weight: 700; fill: #0f172a; }
    .text-muted { font-weight: 500; fill: #64748b; }
    .text-white { fill: #ffffff; }
  </style>

  <!-- ================= STUDIO BACKGROUND ================= -->
  <rect width="1200" height="900" fill="url(#bgGlow)" />
  <rect width="1200" height="900" fill="url(#accentGlow)" />
  <rect width="1200" height="900" fill="url(#accentGlowPurple)" />

  <!-- ================= DEVICE 1: MAIN CATALOG SCREEN ================= -->
  <!-- Position: Center/Left x=110, y=80 -->
  <g transform="translate(110, 80)" filter="url(#deviceShadow)">
    <!-- Outer Frame in Titanium Violet -->
    <rect width="430" height="740" rx="46" fill="url(#phoneBodyGrad)" stroke="#6b21a8" stroke-width="3" />
    <!-- Inner Bezel -->
    <rect x="8" y="8" width="414" height="724" rx="38" fill="#020617" />
    
    <!-- Screen Group with ClipPath -->
    <g clip-path="url(#phoneScreenClip)">
      <!-- Active Screen -->
      <rect x="14" y="14" width="402" height="712" rx="32" fill="url(#screenGlass)" />

      <!-- Status Bar -->
      <text x="42" y="42" class="font-sans" font-size="12" font-weight="700" fill="#0f172a">09:41</text>
      <!-- Battery & Signal -->
      <g transform="translate(340, 32)">
        <path d="M0 10 L4 6 L8 10 Z" fill="#0f172a" />
        <rect x="16" y="2" width="22" height="11" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5" />
        <rect x="18" y="4" width="15" height="7" rx="1.5" fill="#0f172a" />
      </g>

      <!-- ================= APP CONTENT: MOBILE STORE ================= -->
      <!-- App Topbar -->
      <g transform="translate(30, 68)">
        <text x="0" y="20" class="font-sans text-title" font-size="18">Mobile Store</text>
        <text x="0" y="34" class="font-sans text-muted" font-size="11">Smartphones &amp; Accessories</text>

        <!-- Cart with Badge -->
        <circle cx="340" cy="20" r="18" fill="#f5f3ff" />
        <!-- Bag Icon -->
        <rect x="333" y="15" width="14" height="12" rx="2" fill="none" stroke="#0f172a" stroke-width="1.8" />
        <path d="M336 15 C336 11, 344 11, 344 15" fill="none" stroke="#0f172a" stroke-width="1.8" />
        <circle cx="350" cy="11" r="7" fill="#ec4899" />
        <text x="350" y="15" class="font-sans text-white" font-size="9" font-weight="700" text-anchor="middle">2</text>
      </g>

      <!-- Search Bar -->
      <g transform="translate(30, 120)">
        <rect width="342" height="40" rx="12" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1" />
        <circle cx="22" cy="20" r="6" fill="none" stroke="#a855f7" stroke-width="2" />
        <line x1="26" y1="24" x2="31" y2="29" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
        <text x="40" y="25" class="font-sans" font-size="12" fill="#94a3b8">Search model, brand, 5G...</text>
      </g>

      <!-- Promo Banner -->
      <g transform="translate(30, 175)">
        <rect width="342" height="115" rx="16" fill="url(#bannerGrad)" />
        
        <rect x="16" y="14" width="76" height="20" rx="10" fill="#ffffff" fill-opacity="0.25" />
        <text x="24" y="28" class="font-sans text-white" font-size="10" font-weight="700">5G CAMPAIGN</text>

        <text x="16" y="54" class="font-sans text-white" font-size="15" font-weight="800">New Smartphone Pro</text>
        <text x="16" y="72" class="font-sans" font-size="11" fill="#e9d5ff">108MP Camera • 256GB • OLED Display</text>
        
        <!-- Promo Price in Euros -->
        <text x="16" y="98" class="font-sans text-white" font-size="14" font-weight="800">Starting at 499.00 €</text>
        
        <!-- Mini Phone Illustration -->
        <g transform="translate(245, 12)">
          <rect width="75" height="92" rx="12" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" />
          <rect x="5" y="5" width="65" height="82" rx="8" fill="url(#phoneHeroScreen)" />
          <circle cx="37" cy="12" r="3" fill="#ffffff" />
        </g>
      </g>

      <!-- Categories / Filters -->
      <g transform="translate(30, 305)">
        <!-- Category 1 Active (Violet) -->
        <rect width="78" height="30" rx="15" fill="#7c3aed" />
        <text x="39" y="20" class="font-sans text-white" font-size="11" font-weight="700" text-anchor="middle">All</text>

        <!-- Category 2 -->
        <rect x="86" y="0" width="86" height="30" rx="15" fill="#f5f3ff" />
        <text x="129" y="20" class="font-sans text-muted" font-size="11" font-weight="600" text-anchor="middle">Flagship</text>

        <!-- Category 3 -->
        <rect x="180" y="0" width="76" height="30" rx="15" fill="#f5f3ff" />
        <text x="218" y="20" class="font-sans text-muted" font-size="11" font-weight="600" text-anchor="middle">Deals</text>

        <!-- Category 4 -->
        <rect x="264" y="0" width="78" height="30" rx="15" fill="#f5f3ff" />
        <text x="303" y="20" class="font-sans text-muted" font-size="11" font-weight="600" text-anchor="middle">Accessories</text>
      </g>

      <!-- Smartphone Products Grid -->
      <g transform="translate(30, 350)">
        <text x="0" y="16" class="font-sans text-title" font-size="14">Featured Smartphones</text>
        <text x="342" y="16" class="font-sans" font-size="12" fill="#7c3aed" font-weight="600" text-anchor="end">View All</text>

        <!-- PRODUCT CARD 1 -->
        <g transform="translate(0, 30)">
          <rect width="164" height="235" rx="16" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.2" />
          
          <!-- Badge -->
          <rect x="10" y="10" width="50" height="18" rx="4" fill="#dcfce7" />
          <text x="16" y="23" class="font-sans" font-size="10" font-weight="700" fill="#15803d">NEW</text>

          <!-- Vector Illustration Phone 1 -->
          <g transform="translate(47, 30)">
            <rect width="70" height="98" rx="10" fill="url(#phoneDarkBody)" stroke="#6b21a8" stroke-width="1.5" />
            <rect x="4" y="4" width="62" height="90" rx="7" fill="#7c3aed" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
            <!-- Camera Lenses -->
            <circle cx="16" cy="16" r="5" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
            <circle cx="16" cy="30" r="5" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
            <circle cx="28" cy="23" r="4" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
          </g>

          <!-- Details -->
          <text x="12" y="145" class="font-sans text-title" font-size="12" font-weight="700">Smartphone Ultra 5G</text>
          <text x="12" y="160" class="font-sans text-muted" font-size="10">256GB • 6.7" AMOLED Screen</text>
          
          <!-- Price in Euros -->
          <text x="12" y="185" class="font-sans" font-size="15" font-weight="800" fill="#0f172a">899.00 €</text>
          <text x="12" y="198" class="font-sans text-muted" font-size="9">or 29.90 €/mo</text>

          <!-- Buy Button -->
          <rect x="12" y="204" width="140" height="24" rx="6" fill="#7c3aed" />
          <text x="82" y="219" class="font-sans text-white" font-size="10" font-weight="700" text-anchor="middle">Add to Cart</text>
        </g>

        <!-- PRODUCT CARD 2 -->
        <g transform="translate(178, 30)">
          <rect width="164" height="235" rx="16" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.2" />
          
          <!-- Badge -->
          <rect x="10" y="10" width="58" height="18" rx="4" fill="#fdf2f8" />
          <text x="16" y="23" class="font-sans" font-size="10" font-weight="700" fill="#db2777">-15% OFF</text>

          <!-- Vector Illustration Phone 2 -->
          <g transform="translate(47, 30)">
            <rect width="70" height="98" rx="10" fill="#581c87" stroke="#9333ea" stroke-width="1.5" />
            <rect x="4" y="4" width="62" height="90" rx="7" fill="#c026d3" fill-opacity="0.2" stroke="#e879f9" stroke-width="1" />
            <!-- Dual Camera -->
            <circle cx="16" cy="18" r="5" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
            <circle cx="16" cy="32" r="5" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
          </g>

          <!-- Details -->
          <text x="12" y="145" class="font-sans text-title" font-size="12" font-weight="700">Apex Phone 12</text>
          <text x="12" y="160" class="font-sans text-muted" font-size="10">128GB • 50MP Camera</text>
          
          <!-- Price with Discount -->
          <text x="12" y="185" class="font-sans" font-size="15" font-weight="800" fill="#7c3aed">549.00 €</text>
          <text x="82" y="185" class="font-sans text-muted" font-size="11" text-decoration="line-through">649.00 €</text>
          <text x="12" y="198" class="font-sans text-muted" font-size="9">in stock • 24h shipping</text>

          <!-- Buy Button -->
          <rect x="12" y="204" width="140" height="24" rx="6" fill="#0f172a" />
          <text x="82" y="219" class="font-sans text-white" font-size="10" font-weight="700" text-anchor="middle">Add to Cart</text>
        </g>
      </g>

      <!-- Bottom Navigation Bar -->
      <g transform="translate(14, 650)">
        <rect width="402" height="76" fill="#ffffff" stroke="#f3e8ff" stroke-width="1" />
        
        <!-- Icon 1: Home (Active) -->
        <g transform="translate(50, 12)">
          <circle cx="12" cy="10" r="14" fill="#f3e8ff" />
          <path d="M6 14 L12 8 L18 14 V18 H6 Z" fill="#7c3aed" />
          <text x="12" y="32" class="font-sans" font-size="9" font-weight="700" fill="#7c3aed" text-anchor="middle">Home</text>
        </g>

        <!-- Icon 2: Catalog -->
        <g transform="translate(145, 12)">
          <rect x="6" y="4" width="12" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.8" />
          <text x="12" y="32" class="font-sans text-muted" font-size="9" font-weight="500" text-anchor="middle">Catalog</text>
        </g>

        <!-- Icon 3: Favorites -->
        <g transform="translate(240, 12)">
          <path d="M6 8 A3 3 0 0 1 12 6 A3 3 0 0 1 18 8 Q18 14 12 17 Q6 14 6 8 Z" fill="none" stroke="#64748b" stroke-width="1.8" />
          <text x="12" y="32" class="font-sans text-muted" font-size="9" font-weight="500" text-anchor="middle">Favorites</text>
        </g>

        <!-- Icon 4: Profile -->
        <g transform="translate(330, 12)">
          <circle cx="12" cy="7" r="4" fill="none" stroke="#64748b" stroke-width="1.8" />
          <path d="M6 18 C6 14 18 14 18 18" stroke="#64748b" stroke-width="1.8" fill="none" />
          <text x="12" y="32" class="font-sans text-muted" font-size="9" font-weight="500" text-anchor="middle">Profile</text>
        </g>

        <!-- Home Indicator -->
        <rect x="136" y="58" width="130" height="5" rx="2.5" fill="#0f172a" fill-opacity="0.3" />
      </g>
    </g> <!-- End screen clip-path -->

    <!-- Dynamic Island / Speaker -->
    <rect x="155" y="24" width="120" height="26" rx="13" fill="#000000" />
    <circle cx="255" cy="37" r="5" fill="#1e1b4b" />
    <circle cx="175" cy="37" r="4" fill="#0f172a" />
  </g>

  <!-- ================= DEVICE 2: PRODUCT DETAIL (RIGHT) ================= -->
  <!-- Position: x=590, y=100 -->
  <g transform="translate(590, 100)" filter="url(#deviceShadow)">
    <rect width="490" height="700" rx="30" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.5" />

    <!-- Screen Header -->
    <g transform="translate(36, 40)">
      <text x="0" y="24" class="font-sans text-title" font-size="24">Smartphone Pro Titan 5G</text>
      <text x="0" y="46" class="font-sans text-muted" font-size="13">Specifications &amp; Purchase Configuration</text>
    </g>

    <!-- Vector Phone Render -->
    <g transform="translate(150, 140)">
      <!-- Shadow -->
      <ellipse cx="95" cy="270" rx="100" ry="16" fill="#0f172a" fill-opacity="0.12" />

      <!-- Chassis (Brushed Titanium Violet) -->
      <rect width="190" height="260" rx="28" fill="url(#phoneBodyGrad)" stroke="#a855f7" stroke-width="2.5" />
      
      <!-- Glass reflection -->
      <path d="M 12 12 L 178 12 L 12 248 Z" fill="#ffffff" fill-opacity="0.04" />

      <!-- Triple Camera Module -->
      <rect x="20" y="20" width="76" height="84" rx="18" fill="#0f172a" stroke="#4c1d95" stroke-width="2" />
      
      <!-- Lens 1 -->
      <circle cx="44" cy="42" r="14" fill="#1e1b4b" stroke="#6b21a8" stroke-width="2" />
      <circle cx="44" cy="42" r="8" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="42" cy="40" r="2.5" fill="#ffffff" />

      <!-- Lens 2 -->
      <circle cx="44" cy="76" r="14" fill="#1e1b4b" stroke="#6b21a8" stroke-width="2" />
      <circle cx="44" cy="76" r="8" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="42" cy="74" r="2.5" fill="#ffffff" />

      <!-- Lens 3 -->
      <circle cx="72" cy="58" r="11" fill="#1e1b4b" stroke="#6b21a8" stroke-width="2" />
      <circle cx="72" cy="58" r="6" fill="#9333ea" stroke="#e879f9" stroke-width="1.5" />

      <!-- Flash LED & LiDAR -->
      <circle cx="72" cy="34" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
      <circle cx="72" cy="82" r="3" fill="#000000" />
    </g>

    <!-- Color Selection -->
    <g transform="translate(36, 440)">
      <text x="0" y="16" class="font-sans text-title" font-size="13">Selected Color: Titanium Violet</text>
      <g transform="translate(0, 26)">
        <!-- Color 1: Violet (Active) -->
        <circle cx="16" cy="16" r="15" fill="none" stroke="#7c3aed" stroke-width="2" />
        <circle cx="16" cy="16" r="11" fill="#7c3aed" />

        <!-- Color 2: Graphite Black -->
        <circle cx="56" cy="16" r="11" fill="#1e293b" />

        <!-- Color 3: Polar Silver -->
        <circle cx="92" cy="16" r="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />

        <!-- Color 4: Champagne Gold -->
        <circle cx="128" cy="16" r="11" fill="#fde68a" />
      </g>
    </g>

    <!-- Storage Selection -->
    <g transform="translate(36, 520)">
      <text x="0" y="16" class="font-sans text-title" font-size="13">Storage Capacity</text>
      <g transform="translate(0, 26)">
        <rect width="80" height="34" rx="8" fill="#f5f3ff" stroke="#e9d5ff" />
        <text x="40" y="22" class="font-sans text-muted" font-size="12" font-weight="600" text-anchor="middle">128 GB</text>

        <rect x="92" y="0" width="80" height="34" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" />
        <text x="132" y="22" class="font-sans" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">256 GB</text>

        <rect x="184" y="0" width="80" height="34" rx="8" fill="#f5f3ff" stroke="#e9d5ff" />
        <text x="224" y="22" class="font-sans text-muted" font-size="12" font-weight="600" text-anchor="middle">512 GB</text>
      </g>
    </g>

    <!-- Price and Action in Euros -->
    <g transform="translate(36, 615)">
      <line x1="0" y1="0" x2="418" y2="0" stroke="#f3e8ff" stroke-width="1.5" />
      
      <text x="0" y="26" class="font-sans text-muted" font-size="12">Total Price (incl. VAT):</text>
      <text x="0" y="58" class="font-sans text-title" font-size="30" font-weight="900">1,049.00 €</text>

      <rect x="230" y="18" width="188" height="48" rx="12" fill="#7c3aed" />
      <text x="324" y="48" class="font-sans text-white" font-size="14" font-weight="700" text-anchor="middle">Buy Smartphone</text>
    </g>
  </g>
</svg>
