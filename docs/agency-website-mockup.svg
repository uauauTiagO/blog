<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Gradientes de Fundo Studio -->
    <radialGradient id="agencyBgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="agencyCyanGlow" cx="75%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="agencyIndigoGlow" cx="20%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de Elementos do Website -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Sombras -->
    <filter id="browserShadow" x="-10%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="floatCardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>

    <!-- Recorte para o Ecrã do Navegador -->
    <clipPath id="browserScreenClip">
      <rect x="0" y="44" width="1080" height="716" rx="0" />
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .text-title { font-weight: 700; fill: #0f172a; }
    .text-muted { font-weight: 500; fill: #64748b; }
    .text-white { fill: #ffffff; }
  </style>

  <!-- Fundo Studio com Brilho Suave -->
  <rect width="1200" height="900" fill="url(#agencyBgGlow)" />
  <rect width="1200" height="900" fill="url(#agencyCyanGlow)" />
  <rect width="1200" height="900" fill="url(#agencyIndigoGlow)" />

  <!-- ================= JANELA DO NAVEGADOR (MOCKUP DESKTOP) ================= -->
  <!-- Dimensões: 1080 x 760, Centrado em x=60, y=70 -->
  <g transform="translate(60, 70)" filter="url(#browserShadow)">
    <!-- Chassi / Moldura Exterior da Janela -->
    <rect width="1080" height="760" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Barra de Título Superior do Navegador (Estilo Safari/macOS) -->
    <rect width="1080" height="44" rx="18" fill="#0f172a" />
    <rect y="26" width="1080" height="18" fill="#0f172a" /> <!-- tapa cantos redondos inferiores da barra -->

    <!-- Botões da Janela (Fechar, Minimizar, Maximizar) -->
    <circle cx="28" cy="22" r="6" fill="#ef4444" />
    <circle cx="48" cy="22" r="6" fill="#f59e0b" />
    <circle cx="68" cy="22" r="6" fill="#10b981" />

    <!-- Barra de Endereço URL -->
    <g transform="translate(340, 8)">
      <rect width="400" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Ícone de Cadeado de Segurança SSL -->
      <path d="M18 17 V14 A4 4 0 0 1 26 14 V17 M16 17 H28 V24 H16 Z" fill="none" stroke="#22c55e" stroke-width="1.5" />
      <text x="36" y="19" class="font-sans" font-size="12" fill="#cbd5e1" font-weight="500">https://agencia-modular.pt</text>
      <text x="382" y="19" class="font-sans" font-size="11" fill="#64748b" text-anchor="end">WordPress</text>
    </g>

    <!-- CONTEÚDO DO WEBSITE (MASCARADO PELO ECRÃ) -->
    <g clip-path="url(#browserScreenClip)">
      <!-- Fundo da Página Web -->
      <rect x="0" y="44" width="1080" height="716" fill="#ffffff" />

      <!-- ================= HEADER / NAVBAR DO WEBSITE ================= -->
      <g transform="translate(0, 44)">
        <rect width="1080" height="74" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
        
        <!-- Logótipo Textual Limpo da Agência -->
        <g transform="translate(50, 22)">
          <rect width="32" height="32" rx="8" fill="#2563eb" />
          <!-- Símbolo Moderno em M -->
          <path d="M8 24 L8 8 L16 16 L24 8 L24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <text x="42" y="22" class="font-sans text-title" font-size="18" font-weight="800">MODULAR</text>
          <text x="135" y="22" class="font-sans" font-size="11" fill="#2563eb" font-weight="700">AGÊNCIA</text>
        </g>

        <!-- Links de Navegação -->
        <g transform="translate(480, 42)">
          <text x="0" y="0" class="font-sans" font-size="13" font-weight="700" fill="#2563eb">Início</text>
          <text x="75" y="0" class="font-sans text-muted" font-size="13">Serviços</text>
          <text x="160" y="0" class="font-sans text-muted" font-size="13">Portfólio</text>
          <text x="250" y="0" class="font-sans text-muted" font-size="13">Sobre Nós</text>
          <text x="340" y="0" class="font-sans text-muted" font-size="13">Contacto</text>
        </g>

        <!-- Botão CTA Navbar -->
        <g transform="translate(910, 20)">
          <rect width="120" height="36" rx="8" fill="#2563eb" />
          <text x="60" y="23" class="font-sans text-white" font-size="12" font-weight="700" text-anchor="middle">Pedir Orçamento</text>
        </g>
      </g>

      <!-- ================= HERO SECTION DO WEBSITE ================= -->
      <g transform="translate(50, 150)">
        <!-- Pílula de Destaque / Eyebrow -->
        <rect width="250" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <circle cx="12" cy="13" r="4" fill="#2563eb" />
        <text x="24" y="17" class="font-sans" font-size="11" font-weight="700" fill="#1d4ed8">WEBSITES WORDPRESS &amp; DESIGN</text>

        <!-- Título Principal -->
        <text x="0" y="65" class="font-sans text-title" font-size="34" font-weight="900">Desenvolvemos Websites Modernos</text>
        <text x="0" y="105" class="font-sans" font-size="34" font-weight="900" fill="#2563eb">e Estratégias Digitais que Crescem.</text>

        <!-- Descrição -->
        <text x="0" y="140" class="font-sans text-muted" font-size="14">Criamos soluções à medida com WordPress e SquidFlex focadas em performance, autonomia</text>
        <text x="0" y="160" class="font-sans text-muted" font-size="14">do cliente e uma presença visual marcante na internet.</text>

        <!-- Botões de Ação -->
        <g transform="translate(0, 185)">
          <!-- Botão Primário -->
          <rect width="160" height="44" rx="8" fill="#2563eb" />
          <text x="80" y="27" class="font-sans text-white" font-size="13" font-weight="700" text-anchor="middle">Ver os Nossos Serviços</text>

          <!-- Botão Secundário -->
          <rect x="175" y="0" width="150" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
          <text x="250" y="27" class="font-sans text-title" font-size="13" font-weight="600" text-anchor="middle">Projetos Recentes</text>
        </g>

        <!-- Métricas Rápidas no Hero -->
        <g transform="translate(0, 255)">
          <g transform="translate(0, 0)">
            <text x="0" y="20" class="font-sans text-title" font-size="20" font-weight="800">50+</text>
            <text x="0" y="34" class="font-sans text-muted" font-size="11">Websites Criados</text>
          </g>
          <line x1="100" y1="5" x2="100" y2="35" stroke="#e2e8f0" stroke-width="1" />
          <g transform="translate(120, 0)">
            <text x="0" y="20" class="font-sans text-title" font-size="20" font-weight="800">100%</text>
            <text x="0" y="34" class="font-sans text-muted" font-size="11">Design Responsivo</text>
          </g>
          <line x1="220" y1="5" x2="220" y2="35" stroke="#e2e8f0" stroke-width="1" />
          <g transform="translate(240, 0)">
            <text x="0" y="20" class="font-sans" font-size="20" font-weight="800" fill="#15803d">98/100</text>
            <text x="0" y="34" class="font-sans text-muted" font-size="11">Score de Velocidade</text>
          </g>
        </g>
      </g>

      <!-- ILUSTRAÇÃO HERO / PREVIEW DE ECRÃ À DIREITA -->
      <g transform="translate(620, 150)">
        <!-- Moldura de Pré-visualização do Projeto -->
        <rect width="410" height="280" rx="14" fill="#0f172a" stroke="#e2e8f0" stroke-width="1" filter="url(#floatCardShadow)" />
        
        <!-- Header da mini-janela -->
        <rect width="410" height="28" rx="14" fill="#1e293b" />
        <rect y="16" width="410" height="12" fill="#1e293b" />
        <circle cx="16" cy="14" r="3.5" fill="#ef4444" />
        <circle cx="28" cy="14" r="3.5" fill="#f59e0b" />
        <circle cx="40" cy="14" r="3.5" fill="#10b981" />

        <!-- Mockup Visual da Agência dentro do Hero -->
        <rect x="12" y="38" width="386" height="230" rx="8" fill="#f8fafc" />
        
        <!-- Topo do mini-site -->
        <rect x="24" y="50" width="80" height="12" rx="3" fill="#2563eb" />
        <rect x="250" y="52" width="40" height="8" rx="2" fill="#cbd5e1" />
        <rect x="300" y="52" width="40" height="8" rx="2" fill="#cbd5e1" />
        <rect x="350" y="50" width="45" height="12" rx="3" fill="#2563eb" />

        <!-- Banner com imagem vetorial estilizada -->
        <rect x="24" y="74" width="362" height="95" rx="8" fill="url(#heroGradient)" />
        <text x="40" y="110" class="font-sans text-white" font-size="14" font-weight="800">Estratégia &amp; Tecnologia Digital</text>
        <text x="40" y="128" class="font-sans" font-size="10" fill="#bfdbfe">Construímos marcas com impacto online</text>
        <rect x="40" y="140" width="80" height="18" rx="4" fill="#ffffff" />
        <text x="80" y="153" class="font-sans" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">Saber Mais</text>

        <!-- Grelha de 3 caixas em miniatura -->
        <g transform="translate(24, 180)">
          <rect width="112" height="74" rx="6" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="20" cy="22" r="10" fill="#eff6ff" />
          <rect x="12" y="38" width="70" height="8" rx="2" fill="#0f172a" />
          <rect x="12" y="50" width="88" height="6" rx="2" fill="#94a3b8" />

          <rect x="125" y="0" width="112" height="74" rx="6" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="145" cy="22" r="10" fill="#eff6ff" />
          <rect x="137" y="38" width="70" height="8" rx="2" fill="#0f172a" />
          <rect x="137" y="50" width="88" height="6" rx="2" fill="#94a3b8" />

          <rect x="250" y="0" width="112" height="74" rx="6" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="270" cy="22" r="10" fill="#eff6ff" />
          <rect x="262" y="38" width="70" height="8" rx="2" fill="#0f172a" />
          <rect x="262" y="50" width="88" height="6" rx="2" fill="#94a3b8" />
        </g>
      </g>

      <!-- ================= SECÇÃO DE SERVIÇOS (CARDS NO RODAPÉ) ================= -->
      <g transform="translate(50, 470)">
        <text x="0" y="16" class="font-sans text-title" font-size="18">Áreas de Especialização</text>
        <text x="0" y="34" class="font-sans text-muted" font-size="12">Soluções integradas desenvolvidas para empresas</text>

        <!-- CARD 1: WordPress & SquidFlex -->
        <g transform="translate(0, 48)">
          <rect width="315" height="185" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#floatCardShadow)" />
          
          <rect x="20" y="20" width="40" height="40" rx="10" fill="#eff6ff" />
          <!-- Ícone Código/Web -->
          <path d="M34 44 L26 40 L34 36 M46 44 L54 40 L46 36" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

          <text x="20" y="85" class="font-sans text-title" font-size="16">Websites WordPress</text>
          <text x="20" y="105" class="font-sans text-muted" font-size="12">Criação de páginas completas com</text>
          <text x="20" y="123" class="font-sans text-muted" font-size="12">SquidFlex, layouts responsivos e painel</text>
          <text x="20" y="141" class="font-sans text-muted" font-size="12">intuitivo para gestão de conteúdos.</text>

          <text x="20" y="165" class="font-sans" font-size="11" font-weight="700" fill="#2563eb">Saiba Mais →</text>
        </g>

        <!-- CARD 2: Design UI/UX & Redes Sociais -->
        <g transform="translate(332, 48)">
          <rect width="315" height="185" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#floatCardShadow)" />
          
          <rect x="20" y="20" width="40" height="40" rx="10" fill="#fdf2f8" />
          <!-- Ícone Design / Paleta -->
          <circle cx="34" cy="36" r="3" fill="#db2777" />
          <circle cx="46" cy="36" r="3" fill="#db2777" />
          <circle cx="40" cy="46" r="3" fill="#db2777" />

          <text x="20" y="85" class="font-sans text-title" font-size="16">Design &amp; Redes Sociais</text>
          <text x="20" y="105" class="font-sans text-muted" font-size="12">Produção de templates para Instagram,</text>
          <text x="20" y="123" class="font-sans text-muted" font-size="12">Facebook e materiais gráficos para</text>
          <text x="20" y="141" class="font-sans text-muted" font-size="12">fortalecer a imagem corporativa.</text>

          <text x="20" y="165" class="font-sans" font-size="11" font-weight="700" fill="#db2777">Saiba Mais →</text>
        </g>

        <!-- CARD 3: Otimização & Performance -->
        <g transform="translate(664, 48)">
          <rect width="315" height="185" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#floatCardShadow)" />
          
          <rect x="20" y="20" width="40" height="40" rx="10" fill="#ecfdf5" />
          <!-- Ícone Performance / Raio -->
          <path d="M42 26 L32 40 H42 L38 54 L50 38 H40 Z" fill="#059669" />

          <text x="20" y="85" class="font-sans text-title" font-size="16">Otimização &amp; SEO</text>
          <text x="20" y="105" class="font-sans text-muted" font-size="12">Estruturação de conteúdos para motores</text>
          <text x="20" y="123" class="font-sans text-muted" font-size="12">de busca, carregamento ultra-rápido</text>
          <text x="20" y="141" class="font-sans text-muted" font-size="12">e compatibilidade multi-dispositivo.</text>

          <text x="20" y="165" class="font-sans" font-size="11" font-weight="700" fill="#059669">Saiba Mais →</text>
        </g>
      </g>
    </g> <!-- Fim do recorte da janela -->
  </g>
</svg>
