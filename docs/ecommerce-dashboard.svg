<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Sombras -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .text-title { font-weight: 700; fill: #0f172a; }
    .text-muted { font-weight: 500; fill: #64748b; }
    .text-light { fill: #ffffff; }
    .card-bg { fill: #ffffff; rx: 12px; filter: url(#cardShadow); }
    .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <!-- Fundo Geral -->
  <rect width="1200" height="800" fill="#f8fafc" />

  <!-- ================= SIDEBAR (BLUE) ================= -->
  <rect width="250" height="800" fill="url(#sidebarGrad)" />

  <!-- Sidebar Header -->
  <g transform="translate(24, 32)">
    <rect width="36" height="36" rx="8" fill="#3b82f6" />
    <!-- Grid icon -->
    <rect x="8" y="8" width="8" height="8" rx="2" fill="#ffffff" />
    <rect x="20" y="8" width="8" height="8" rx="2" fill="#ffffff" />
    <rect x="8" y="20" width="8" height="8" rx="2" fill="#ffffff" />
    <rect x="20" y="20" width="8" height="8" rx="2" fill="#93c5fd" />
    
    <text x="48" y="18" class="font-base text-light" font-size="16" font-weight="700">E-COMMERCE</text>
    <text x="48" y="32" class="font-base" font-size="11" fill="#93c5fd" font-weight="500">Sales Dashboard</text>
  </g>

  <!-- Sidebar Divider -->
  <line x1="24" y1="88" x2="226" y2="88" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />

  <!-- Navigation Menu -->
  <g transform="translate(16, 110)">
    <!-- Active Item: Overview -->
    <rect x="0" y="0" width="218" height="42" rx="8" fill="#ffffff" fill-opacity="0.15" />
    <circle cx="24" cy="21" r="5" fill="#60a5fa" />
    <text x="42" y="26" class="font-base text-light" font-size="14" font-weight="600">Overview</text>

    <!-- Other Nav Items -->
    <g transform="translate(0, 52)">
      <circle cx="24" cy="18" r="4" fill="#93c5fd" fill-opacity="0.6" />
      <text x="42" y="23" class="font-base" font-size="14" fill="#cbd5e1" font-weight="500">Sales &amp; Invoices</text>
    </g>

    <g transform="translate(0, 96)">
      <circle cx="24" cy="18" r="4" fill="#93c5fd" fill-opacity="0.6" />
      <text x="42" y="23" class="font-base" font-size="14" fill="#cbd5e1" font-weight="500">Product Catalog</text>
    </g>

    <g transform="translate(0, 140)">
      <circle cx="24" cy="18" r="4" fill="#93c5fd" fill-opacity="0.6" />
      <text x="42" y="23" class="font-base" font-size="14" fill="#cbd5e1" font-weight="500">Orders</text>
      <!-- Order Badge -->
      <rect x="175" y="10" width="30" height="18" rx="9" fill="#3b82f6" />
      <text x="190" y="23" class="font-base text-light" font-size="11" font-weight="700" text-anchor="middle">12</text>
    </g>

    <g transform="translate(0, 184)">
      <circle cx="24" cy="18" r="4" fill="#93c5fd" fill-opacity="0.6" />
      <text x="42" y="23" class="font-base" font-size="14" fill="#cbd5e1" font-weight="500">Customers</text>
    </g>

    <g transform="translate(0, 228)">
      <circle cx="24" cy="18" r="4" fill="#93c5fd" fill-opacity="0.6" />
      <text x="42" y="23" class="font-base" font-size="14" fill="#cbd5e1" font-weight="500">Reports</text>
    </g>

    <g transform="translate(0, 272)">
      <circle cx="24" cy="18" r="4" fill="#93c5fd" fill-opacity="0.6" />
      <text x="42" y="23" class="font-base" font-size="14" fill="#cbd5e1" font-weight="500">Settings</text>
    </g>
  </g>

  <!-- Sidebar Footer Card -->
  <g transform="translate(20, 680)">
    <rect width="210" height="90" rx="10" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.4" />
    <circle cx="22" cy="26" r="4" fill="#22c55e" />
    <text x="34" y="30" class="font-base text-light" font-size="12" font-weight="600">Database Connected</text>
    <text x="16" y="52" class="font-base" font-size="11" fill="#94a3b8">MySQL v8.0 • Active</text>
    <text x="16" y="70" class="font-base" font-size="11" fill="#60a5fa">Server: Online (99.9%)</text>
  </g>

  <!-- ================= TOP HEADER ================= -->
  <rect x="250" y="0" width="950" height="70" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Search Bar -->
  <g transform="translate(280, 16)">
    <rect width="360" height="38" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- Magnifier -->
    <circle cx="20" cy="19" r="6" stroke="#94a3b8" stroke-width="2" fill="none" />
    <line x1="24" y1="23" x2="30" y2="29" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <text x="38" y="24" class="font-base" font-size="13" fill="#94a3b8">Search orders, customers, or products...</text>
  </g>

  <!-- Right Indicators -->
  <g transform="translate(980, 18)">
    <!-- Notification -->
    <circle cx="20" cy="17" r="16" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="20" cy="15" r="5" stroke="#475569" stroke-width="1.8" fill="none" />
    <circle cx="27" cy="9" r="4" fill="#ef4444" />

    <!-- Admin Profile -->
    <g transform="translate(60, 0)">
      <circle cx="18" cy="17" r="18" fill="#dbeafe" stroke="#bfdbfe" />
      <text x="18" y="22" class="font-base" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">AD</text>
      <text x="44" y="16" class="font-base text-title" font-size="13">Administrator</text>
      <text x="44" y="30" class="font-base text-muted" font-size="11">admin@company.eu</text>
    </g>
  </g>

  <!-- ================= MAIN CONTENT AREA ================= -->

  <!-- Page Header -->
  <g transform="translate(280, 95)">
    <text x="0" y="22" class="font-base text-title" font-size="22">Sales Operations Overview</text>
    <text x="0" y="40" class="font-base text-muted" font-size="13">Real-time consolidated store performance data</text>

    <!-- Date Range Button -->
    <rect x="730" y="5" width="150" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="750" y="27" class="font-base text-muted" font-size="12" font-weight="600">Last 30 Days</text>
    <polygon points="860,23 865,29 870,23" fill="#64748b" />
  </g>

  <!-- STATISTIC CARDS (KPI) -->
  <g transform="translate(280, 150)">
    <!-- Card 1: Total Revenue -->
    <g transform="translate(0, 0)">
      <rect width="210" height="105" class="card-bg" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="18" y="28" class="font-base text-muted" font-size="12" font-weight="600">TOTAL REVENUE</text>
      <text x="18" y="62" class="font-base" font-size="24" font-weight="800" fill="#1d4ed8">38,450.00 €</text>
      <rect x="18" y="74" width="70" height="20" rx="4" fill="#dcfce7" />
      <text x="26" y="88" class="font-base" font-size="11" font-weight="700" fill="#15803d">▲ +14.2%</text>
      <text x="96" y="88" class="font-base text-muted" font-size="11">vs last mo.</text>
    </g>

    <!-- Card 2: Orders Today -->
    <g transform="translate(225, 0)">
      <rect width="210" height="105" class="card-bg" stroke="#e2e8f0" stroke-width="1" />
      <text x="18" y="28" class="font-base text-muted" font-size="12" font-weight="600">ORDERS TODAY</text>
      <text x="18" y="62" class="font-base text-title" font-size="24" font-weight="800">428</text>
      <rect x="18" y="74" width="65" height="20" rx="4" fill="#dcfce7" />
      <text x="26" y="88" class="font-base" font-size="11" font-weight="700" fill="#15803d">▲ +8.5%</text>
      <text x="90" y="88" class="font-base text-muted" font-size="11">active orders</text>
    </g>

    <!-- Card 3: Average Order -->
    <g transform="translate(450, 0)">
      <rect width="210" height="105" class="card-bg" stroke="#e2e8f0" stroke-width="1" />
      <text x="18" y="28" class="font-base text-muted" font-size="12" font-weight="600">AVERAGE ORDER</text>
      <text x="18" y="62" class="font-base text-title" font-size="24" font-weight="800">89.83 €</text>
      <rect x="18" y="74" width="65" height="20" rx="4" fill="#dcfce7" />
      <text x="26" y="88" class="font-base" font-size="11" font-weight="700" fill="#15803d">▲ +3.8%</text>
      <text x="90" y="88" class="font-base text-muted" font-size="11">per cart</text>
    </g>

    <!-- Card 4: Conversion Rate -->
    <g transform="translate(675, 0)">
      <rect width="205" height="105" class="card-bg" stroke="#e2e8f0" stroke-width="1" />
      <text x="18" y="28" class="font-base text-muted" font-size="12" font-weight="600">CONVERSION RATE</text>
      <text x="18" y="62" class="font-base text-title" font-size="24" font-weight="800">4.65%</text>
      <rect x="18" y="74" width="65" height="20" rx="4" fill="#eff6ff" />
      <text x="26" y="88" class="font-base" font-size="11" font-weight="700" fill="#2563eb">● Stable</text>
      <text x="90" y="88" class="font-base text-muted" font-size="11">12,400 visits</text>
    </g>
  </g>

  <!-- CHARTS ROW -->
  <g transform="translate(280, 275)">
    <!-- Main Chart: Monthly Revenue -->
    <g transform="translate(0, 0)">
      <rect width="560" height="255" class="card-bg" stroke="#e2e8f0" stroke-width="1" />
      <text x="24" y="32" class="font-base text-title" font-size="15">Monthly Revenue Trend (€)</text>
      <text x="24" y="48" class="font-base text-muted" font-size="12">Historical invoiced revenue in Euros</text>

      <!-- Grid lines -->
      <line x1="60" y1="80" x2="520" y2="80" class="grid-line" />
      <text x="50" y="84" class="font-base text-muted" font-size="10" text-anchor="end">40,000 €</text>

      <line x1="60" y1="120" x2="520" y2="120" class="grid-line" />
      <text x="50" y="124" class="font-base text-muted" font-size="10" text-anchor="end">30,000 €</text>

      <line x1="60" y1="160" x2="520" y2="160" class="grid-line" />
      <text x="50" y="164" class="font-base text-muted" font-size="10" text-anchor="end">20,000 €</text>

      <line x1="60" y1="200" x2="520" y2="200" class="grid-line" />
      <text x="50" y="204" class="font-base text-muted" font-size="10" text-anchor="end">10,000 €</text>

      <!-- Filled area gradient -->
      <path d="M 70 190 Q 110 170, 140 160 T 210 145 T 280 130 T 350 150 T 420 100 T 490 85 L 490 220 L 70 220 Z" fill="url(#chartAreaGrad)" />

      <!-- Curve -->
      <path d="M 70 190 Q 110 170, 140 160 T 210 145 T 280 130 T 350 150 T 420 100 T 490 85" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />

      <!-- Points -->
      <circle cx="70" cy="190" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="140" cy="160" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="210" cy="145" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="280" cy="130" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="350" cy="150" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="420" cy="100" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="490" cy="85" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />

      <!-- Tooltip -->
      <rect x="430" y="45" width="85" height="26" rx="5" fill="#0f172a" />
      <polygon points="470,71 475,76 480,71" fill="#0f172a" />
      <text x="472" y="62" class="font-base text-light" font-size="11" font-weight="700" text-anchor="middle">38,450 €</text>

      <!-- Months X axis -->
      <text x="70" y="235" class="font-base text-muted" font-size="11" text-anchor="middle">Jan</text>
      <text x="140" y="235" class="font-base text-muted" font-size="11" text-anchor="middle">Feb</text>
      <text x="210" y="235" class="font-base text-muted" font-size="11" text-anchor="middle">Mar</text>
      <text x="280" y="235" class="font-base text-muted" font-size="11" text-anchor="middle">Apr</text>
      <text x="350" y="235" class="font-base text-muted" font-size="11" text-anchor="middle">May</text>
      <text x="420" y="235" class="font-base text-muted" font-size="11" text-anchor="middle">Jun</text>
      <text x="490" y="235" class="font-base" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Jul</text>
    </g>

    <!-- Secondary Chart: Sales by Category -->
    <g transform="translate(580, 0)">
      <rect width="300" height="255" class="card-bg" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="32" class="font-base text-title" font-size="15">Sales by Category</text>
      <text x="20" y="48" class="font-base text-muted" font-size="12">Percentage distribution</text>

      <!-- Bars -->
      <g transform="translate(20, 68)">
        <text x="0" y="12" class="font-base text-title" font-size="12">Hardware &amp; Devices</text>
        <text x="260" y="12" class="font-base text-muted" font-size="12" text-anchor="end">17,300 € (45%)</text>
        <rect x="0" y="18" width="260" height="9" rx="4.5" fill="#f1f5f9" />
        <rect x="0" y="18" width="117" height="9" rx="4.5" fill="#1d4ed8" />

        <text x="0" y="52" class="font-base text-title" font-size="12">Systems &amp; Licenses</text>
        <text x="260" y="52" class="font-base text-muted" font-size="12" text-anchor="end">11,530 € (30%)</text>
        <rect x="0" y="58" width="260" height="9" rx="4.5" fill="#f1f5f9" />
        <rect x="0" y="58" width="78" height="9" rx="4.5" fill="#2563eb" />

        <text x="0" y="92" class="font-base text-title" font-size="12">Peripherals &amp; Cables</text>
        <text x="260" y="92" class="font-base text-muted" font-size="12" text-anchor="end">5,760 € (15%)</text>
        <rect x="0" y="98" width="260" height="9" rx="4.5" fill="#f1f5f9" />
        <rect x="0" y="98" width="39" height="9" rx="4.5" fill="#60a5fa" />

        <text x="0" y="132" class="font-base text-title" font-size="12">Support &amp; Services</text>
        <text x="260" y="132" class="font-base text-muted" font-size="12" text-anchor="end">3,860 € (10%)</text>
        <rect x="0" y="138" width="260" height="9" rx="4.5" fill="#f1f5f9" />
        <rect x="0" y="138" width="26" height="9" rx="4.5" fill="#93c5fd" />
      </g>
    </g>
  </g>

  <!-- TABLE: RECENT TRANSACTIONS -->
  <g transform="translate(280, 545)">
    <rect width="880" height="230" class="card-bg" stroke="#e2e8f0" stroke-width="1" />

    <!-- Table Title -->
    <text x="24" y="30" class="font-base text-title" font-size="15">Recent Transactions</text>
    <text x="24" y="46" class="font-base text-muted" font-size="12">Latest orders recorded on the platform</text>

    <!-- Table Header -->
    <rect x="20" y="60" width="840" height="30" rx="6" fill="#f8fafc" />
    <text x="35" y="80" class="font-base text-muted" font-size="11" font-weight="700">ORDER ID</text>
    <text x="140" y="80" class="font-base text-muted" font-size="11" font-weight="700">CUSTOMER</text>
    <text x="310" y="80" class="font-base text-muted" font-size="11" font-weight="700">DATE / TIME</text>
    <text x="470" y="80" class="font-base text-muted" font-size="11" font-weight="700">METHOD</text>
    <text x="610" y="80" class="font-base text-muted" font-size="11" font-weight="700">STATUS</text>
    <text x="830" y="80" class="font-base text-muted" font-size="11" font-weight="700" text-anchor="end">TOTAL AMOUNT (€)</text>

    <!-- Row 1 -->
    <g transform="translate(20, 95)">
      <text x="15" y="20" class="font-base" font-size="12" font-weight="600" fill="#2563eb">#EU-4820</text>
      <text x="120" y="20" class="font-base text-title" font-size="12">Robert Foster</text>
      <text x="290" y="20" class="font-base text-muted" font-size="12">Today, 17:45</text>
      <text x="450" y="20" class="font-base text-muted" font-size="12">Bank Transfer</text>
      <rect x="585" y="6" width="80" height="20" rx="10" fill="#dcfce7" />
      <text x="625" y="20" class="font-base" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Completed</text>
      <text x="810" y="20" class="font-base text-title" font-size="13" font-weight="700" text-anchor="end">289.50 €</text>
      <line x1="0" y1="32" x2="840" y2="32" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 130)">
      <text x="15" y="20" class="font-base" font-size="12" font-weight="600" fill="#2563eb">#EU-4819</text>
      <text x="120" y="20" class="font-base text-title" font-size="12">Martha Oliver</text>
      <text x="290" y="20" class="font-base text-muted" font-size="12">Today, 16:20</text>
      <text x="450" y="20" class="font-base text-muted" font-size="12">Digital Payment</text>
      <rect x="585" y="6" width="80" height="20" rx="10" fill="#dcfce7" />
      <text x="625" y="20" class="font-base" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Completed</text>
      <text x="810" y="20" class="font-base text-title" font-size="13" font-weight="700" text-anchor="end">74.20 €</text>
      <line x1="0" y1="32" x2="840" y2="32" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 165)">
      <text x="15" y="20" class="font-base" font-size="12" font-weight="600" fill="#2563eb">#EU-4818</text>
      <text x="120" y="20" class="font-base text-title" font-size="12">Thomas Reed</text>
      <text x="290" y="20" class="font-base text-muted" font-size="12">Today, 14:10</text>
      <text x="450" y="20" class="font-base text-muted" font-size="12">Credit Card</text>
      <rect x="585" y="6" width="86" height="20" rx="10" fill="#eff6ff" />
      <text x="628" y="20" class="font-base" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Processing</text>
      <text x="810" y="20" class="font-base text-title" font-size="13" font-weight="700" text-anchor="end">512.00 €</text>
    </g>
  </g>
</svg>
